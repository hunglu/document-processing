version: "3.9"

services:
  # ──── Azure SQL Server ──────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: docproc-sqlserver
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_SA_PASSWORD}" -Q "SELECT 1" -b -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docproc-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ──── Azurite (Azure Blob Storage emulator) ─────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: docproc-azurite
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    volumes:
      - azurite_data:/data
    command: azurite --loose --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data

  # ──── Azure Service Bus Emulator ─────────────────────────────────────────
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: docproc-servicebus-emulator
    ports:
      - "5672:5672"
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    volumes:
      - ./infra/local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      sqlserver:
        condition: service_healthy

  # ──── DataDog Agent — optional, only starts with --profile monitoring ──────
  datadog-agent:
    profiles: ["monitoring"]
    image: datadog/agent:latest
    container_name: docproc-datadog-agent
    environment:
      DD_API_KEY: "${DD_API_KEY}"
      DD_SITE: "${DD_SITE:-datadoghq.com}"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_OTLP_CONFIG_RECEIVER_GRPC_ENABLED: "true"
      DD_OTLP_CONFIG_RECEIVER_GRPC_ENDPOINT: "0.0.0.0:4317"
      DD_LOG_LEVEL: WARN
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

  # ──── API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: docproc-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DocumentProcessing;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true"
      Redis__ConnectionString: "redis:6379"
      Azure__BlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1"
      Azure__BlobStorage__CdnEndpointBaseUrl: "http://azurite:10000/devstoreaccount1"
      Azure__ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ApplicationInsights__ConnectionString: "${APPINSIGHTS_CONNECTION_STRING:-InstrumentationKey=00000000-0000-0000-0000-000000000000}"
      DataDog__OtlpEndpoint: "http://datadog-agent:4317"
      DataDog__ServiceName: "document-processing-api"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      servicebus-emulator:
        condition: service_started

  # ──── Worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.Worker
    container_name: docproc-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DocumentProcessing;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true"
      Redis__ConnectionString: "redis:6379"
      Azure__BlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1"
      Azure__BlobStorage__CdnEndpointBaseUrl: "http://azurite:10000/devstoreaccount1"
      Azure__ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ApplicationInsights__ConnectionString: "${APPINSIGHTS_CONNECTION_STRING:-InstrumentationKey=00000000-0000-0000-0000-000000000000}"
      DataDog__OtlpEndpoint: "http://datadog-agent:4317"
      DataDog__ServiceName: "document-processing-worker"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      servicebus-emulator:
        condition: service_started

volumes:
  sqlserver_data:
  redis_data:
  azurite_data:
